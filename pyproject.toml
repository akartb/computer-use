[project]
name = "computer-use-plugin"
version = "0.2.0"
description = "A modular, plugin-based AI agent system for computer GUI interaction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Computer Use Plugin Team"}
]
keywords = ["ai", "agent", "computer-use", "automation", "gui", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mss>=9.0",
    "Pillow>=10.0",
    "pyautogui>=0.9",
    "pynput>=1.7",
    "pluggy>=1.3",
    "pydantic>=2.0",
    "httpx>=0.25",
    "openai>=1.0",
    "anthropic>=0.30",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=11.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
grpc = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=11.0",
    "mcp>=1.0",
]

[project.scripts]
computer-use = "src.cli:main"
computer-use-mcp = "src.mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build]
exclude = ["docs/**", "examples/**", "logs/**", "config/**", ".pytest_cache/**", "__pycache__/**"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
